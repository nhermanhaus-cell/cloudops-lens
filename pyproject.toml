[project]
name = "cloudops-lens"
version = "0.2.0"
description = "A public-data reliability, capacity, GPU, and open-source analytics prototype"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "duckdb>=1.2.2",
  "pandas>=2.2.3",
  "plotly>=6.0.1",
  "pytz>=2025.2",
  "requests>=2.32.3",
  "streamlit>=1.44.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.11.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudops_lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
